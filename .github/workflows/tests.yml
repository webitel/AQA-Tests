name: API tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config files
        run: |
          cat <<'EOF' > .settings.yaml
          ${{ env.SETTINGS_RAW }}
          EOF

          cat <<'EOF' > .secret.yaml
          ${{ env.SECRET_RAW }}
          EOF
        env:
          SETTINGS_RAW: ${{ secrets.SETTINGS_YAML }}
          SECRET_RAW: ${{ secrets.SECRET_YAML }}

      - name: Run API tests with pytest and generate Allure results
        continue-on-error: true
        run: |
          pytest --dist=loadgroup --strict-markers --env=test tests/ --numprocesses 2 --count 1 --alluredir=allure-results/ --junitxml=report.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (gh-pages branch)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Download Allure results
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: allure-results
          path: current-allure-results

      - name: Load Allure history and generate report
        uses: allure-framework/allure-github-actions@v2.3.7
        if: always()
        with:
          allure_results: current-allure-results
          allure_history: gh-pages-dir/allure-history
          allure_report: allure-report
          keep_reports: 20

      - name: Move report to deployment directory
        if: always()
        run: |
          mkdir -p gh-pages-dir/allure-history
          cp -r allure-report/. gh-pages-dir/allure-history/${{ github.run_number }}/
          cp -r allure-report/. gh-pages-dir/

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.ALLURE_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-dir